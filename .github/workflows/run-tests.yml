name: Run tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Full run against Binance
        timeout-minutes: 30
        env:
          BINANCE_INTEGRATION: "1"
          BINANCE_BASE_URL: https://data-api.binance.vision/api/v3
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
        run: go test ./internal/calculator -run TestRunAgainstBinance -v -count=1 -timeout 30m
